<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Car Task</title>
    </head>
    <body>
        
        <h1>Car Details</h1>

        <!-- Print the car details to the screen -->
        <div id="car-info"></div>

        <script>

            // Car Class and properties brand and model
            class Car {
                constructor() {
                    this.brand = "";
                    this.model = "";
                }
            }

            // Create object from the class
            const myCar = new Car();

            // Give the object a brand and a model
            myCar.brand = "Toyota";
            myCar.model = "Corolla";

            // Get the object's property values and print them to the screen 
            const carInfo = document.getElementById("car-info");

            carInfo.innerHTML = `
                <p>Brand: ${myCar.brand}</p>
                <p>Model: ${myCar.model}</p>
            `;



        </script>

    </body>
</html>
